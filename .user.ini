; WorkPulse — upload limits
;
; Audits accept video (up to 64 MB, see AUDIT_MAX_VIDEO_SIZE in
; modules/audit.php), and a phone clip of a minute or two lands in the
; 30–60 MB range. PHP discards an over-sized request before any handler
; runs, so without these the app can only ever refuse such a file — and
; the refusal takes every photo posted alongside it down with it.
;
; post_max_size must stay above upload_max_filesize: it caps the whole
; request, video plus photos plus the form's own text.
;
; This file is read by PHP-FPM and CGI SAPIs, which is what most shared
; hosts run. Under mod_php it is ignored — there the same two values have
; to go in php.ini or a .htaccess php_value block, or the app will keep
; reporting the smaller limit it actually has (it reads the real values
; and never promises more than the server will take).
upload_max_filesize = 64M
post_max_size = 72M

; A 64 MB upload over store wifi can outlast the default 60s.
max_execution_time = 300
max_input_time = 300
