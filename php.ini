; WorkPulse — upload limits for wp.aromen.biz
;
; cPanel reads a php.ini from a domain's document root on hosts running
; PHP as CGI/FastCGI or suPHP — which is why the other domains on this
; account each have one. It is ignored under PHP-FPM, where .user.ini
; beside it does the same job, and under mod_php, where neither is read
; and these values belong in the account's main php.ini (cPanel →
; MultiPHP INI Editor).
;
; Keeping both files costs nothing: whichever one this server honours
; wins, and the other is inert.
;
; Why these numbers: audits accept video up to 64 MB
; (AUDIT_MAX_VIDEO_SIZE, modules/audit.php) because a phone clip of a
; minute or two lands in the 30-60 MB range. PHP discards an over-sized
; request before any of the app runs, so without these the app can only
; refuse such a file — and that refusal loses every photo posted
; alongside it. post_max_size stays above upload_max_filesize: it caps
; the whole request, video plus photos plus the form's own fields.
;
; The app never promises more than the server allows — it reads these
; values and quotes the smaller figure in the upload hint, so the audit
; page itself will tell you whether this file took effect.
upload_max_filesize = 64M
post_max_size = 72M

; A 64 MB upload over store wifi outlasts the 60s default.
max_execution_time = 300
max_input_time = 300
